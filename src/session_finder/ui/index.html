<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session Finder</title>
<style>/*STYLE*/</style>
</head>
<body>
  <!-- Visible text comes from STRINGS in app.js ([data-i18n*] attributes) -->
  <main>
    <section id="graph-wrap">
      <div id="graph"></div>
      <div id="tip" hidden></div>
      <div id="legend">
        <div><span class="folder-ico lg-dir"></span> <span data-i18n="legendFolder"></span></div>
        <div><span class="lg-session"></span> <span data-i18n="legendSession"></span></div>
        <div><span class="lg-running"></span> <span data-i18n="legendRunning"></span></div>
        <div id="legend-noreply" hidden><span class="lg-warn"></span> <span data-i18n="legendNoReply"></span></div>
      </div>
    </section>
    <aside id="panel">
      <header>
        <div class="title-row">
          <div class="title">Session Finder <span id="count"></span><span id="fuzzy-tag" data-i18n="fuzzyTag" data-i18n-title="fuzzyTitle" hidden></span></div>
          <div class="title-actions">
            <button id="language" type="button"></button>
            <button id="palette" type="button"></button>
            <button id="mode" type="button"></button>
          </div>
          <div id="language-menu" class="popup-menu" role="menu" hidden></div>
          <div id="palette-menu" class="popup-menu" role="menu" hidden></div>
        </div>
        <div class="search-row">
          <input id="search" type="text" data-i18n-placeholder="searchPlaceholder" autocomplete="off" spellcheck="false">
          <button id="show-hidden" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
              <line class="slash" x1="4" y1="4" x2="20" y2="20"/>
            </svg>
          </button>
        </div>
        <div id="scope" hidden><span class="scope-path"></span><button type="button" data-i18n-title="removeFilter">✕</button></div>
      </header>
      <div id="list" role="listbox"></div>
      <footer>
        <span id="status"></span>
        <span id="hint" data-i18n="hint"></span>
      </footer>
    </aside>
  </main>
  <!-- Safety net, kept tiny and separate from app.js on purpose: a syntax error in app.js
       prevents any of its code from running, so the handler cannot live there.
       Text: the chosen language (T, from app.js) when it loaded, else the English fallback below. -->
  <script>
  (() => {
    const FALLBACK = {
      errorTitle: 'Session Finder ran into a problem',
      errorLoad: 'The interface could not start.',
      errorLater: 'If nothing looks wrong to you, you can keep using it.',
      errorClose: 'Close',
      errorContinue: 'Continue',
    };
    let shown = false;
    const text = key => (typeof T !== 'undefined' && T[key]) || FALLBACK[key];
    function report(message, stack) {
      if (shown) return;   // first error only: after "Continue" the user chose to go on
      shown = true;
      const ready = !!window.__appReady;   // set at the end of app.js
      const el = (tag, css, content) => {
        const e = document.createElement(tag);
        e.style.cssText = css;
        if (content) e.textContent = content;
        return e;
      };
      const overlay = el('div', 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;' +
        'justify-content:center;background:rgba(0,0,0,.6);font:13px sans-serif');
      const box = el('div', 'max-width:80%;max-height:80%;display:flex;flex-direction:column;gap:10px;' +
        'padding:16px;border-radius:8px;background:#1e1e2e;color:#ddd;border:1px solid #f38ba8');
      box.append(el('div', 'font-weight:bold;font-size:15px;color:#f38ba8', text('errorTitle')),
                 el('div', '', text(ready ? 'errorLater' : 'errorLoad')),
                 el('pre', 'margin:0;overflow:auto;font-size:11px;white-space:pre-wrap;user-select:text',
                    [message, stack].filter(Boolean).join('\n')));
      const buttons = el('div', 'display:flex;gap:8px;justify-content:flex-end');
      const button = (label, onclick) => {
        const b = el('button', 'padding:4px 14px;cursor:pointer', label);
        b.onclick = onclick;
        buttons.append(b);
      };
      button(text('errorClose'), () => window.pywebview?.api ? window.pywebview.api.close() : window.close());
      if (ready) button(text('errorContinue'), () => overlay.remove());   // nothing usable before the app is up
      box.append(buttons);
      overlay.append(box);
      (document.body || document.documentElement).append(overlay);
    }
    // The stack can be empty (syntax errors, global code, some engines): file:line:col always exists
    window.addEventListener('error', e => report(e.message,
      e.error?.stack || `at ${(e.filename || 'inline script').split('/').pop()}:${e.lineno}:${e.colno}`));
    window.addEventListener('unhandledrejection', e => report(String(e.reason?.message || e.reason), e.reason?.stack));
  })();
  </script>
  <script>/*VENDOR*/</script>
  <script>/*DATA*/</script>
  <script>/*APP*/</script>
</body>
</html>
